name: minduc
description: "mindUC - Aplicación de Bienestar Mental y Productividad Universitaria"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Dependency Injection
  flutter_riverpod: ^2.6.1

  # Declarative Routing
  go_router: ^14.6.2

  # Firebase Services (desacoplados tras repositorios)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0

  # Design System, Typography & UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  flutter_animate: ^4.5.2

  # Local Cache & Security
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
